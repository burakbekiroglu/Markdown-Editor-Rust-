[package]
name = "md-editor"
version = "1.0.0"
description = "Hafif Windows Markdown editoru"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "md_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
trash = "5"
dunce = "1"
percent-encoding = "2"
tauri-plugin-single-instance = "2"
notify = "8"

# Windows startup preflight: WebView2 loader detection plus the registry and
# message-box APIs it falls back to (see `src/platform.rs`).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
